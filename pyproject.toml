[project]
name = "banking-api"
version = "0.1.0"
description = "A banking CRUD API backed by MongoDB"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pwdlib[argon2]",
    "pymongo>=4.10.0,<5.0.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27.0,<1.0.0",
    "pytest>=8.0.0,<9.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
